<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<title>Class 10 B · Our School Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090e;
  --bg-deep: #030408;
  --accent: #f5a524;
  --accent-light: #fde68a;
  --rgb: 245, 165, 36;
  --text: #f3f5f9;
  --text-dim: #9aa4b6;
  --muted: #6b778c;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --glass: rgba(13, 17, 26, 0.72);
  --glass-card: rgba(18, 24, 38, 0.6);
  --glass-hover: rgba(255, 255, 255, 0.07);
  --glass-active: rgba(var(--rgb), 0.16);
  --specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
  --shadow-lg: 0 24px 64px -12px rgba(0, 0, 0, 0.7);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --R: 260px;
  --rot: 0deg;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--bg-deep);
  color-scheme: dark;
}

body {
  background: radial-gradient(1100px 800px at 75% 20%, rgba(var(--rgb), 0.09), transparent 60%),
              radial-gradient(900px 700px at 15% 65%, rgba(56, 189, 248, 0.04), transparent 60%),
              var(--bg-deep);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  line-height: 1.55;
  min-height: 100vh;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--accent);
  color: #04060a;
}

.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---------------- Atmospheric FX & Canvases ---------------- */
#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(7, 9, 14, 0.85) 100%);
}

.flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 30;
  opacity: 0;
  background: radial-gradient(circle at var(--fx, 70%) var(--fy, 45%), rgba(255, 255, 255, 0.35), rgba(var(--rgb), 0.18) 30%, transparent 65%);
}
.flash.go {
  animation: flashBurst 0.85s ease-out;
}
@keyframes flashBurst {
  from { opacity: 1; }
  to { opacity: 0; }
}

.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  opacity: 0.035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Fullscreen SVG layer for Gooey Fluid Droplet */
.fluid-layer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 95;
}

/* ---------------- Top Glass Header ---------------- */
.top {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px clamp(18px, 5vw, 48px);
  background: rgba(7, 9, 14, 0.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
}

.brand {
  font: 700 15px 'Syne', sans-serif;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px var(--accent);
  transition: background 0.6s, box-shadow 0.6s;
}
.brand span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-left: 4px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-shatter {
  font: 600 11px 'JetBrains Mono', monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  transition: color 0.3s, border-color 0.3s, background 0.3s;
}
.btn-shatter:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.07);
}

.sound {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font: 600 11px 'JetBrains Mono', monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 7px 15px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(12px);
  transition: color 0.3s, border-color 0.3s, background 0.3s;
}
.sound:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.06);
}
.bars {
  display: flex;
  gap: 2.5px;
  align-items: flex-end;
  height: 12px;
}
.bars i {
  width: 2px;
  height: 3px;
  background: var(--accent);
  border-radius: 1px;
  transition: background 0.6s;
}
.sound.on .bars i {
  animation: eq 0.9s ease-in-out infinite;
}
.sound.on .bars i:nth-child(2) { animation-delay: -0.32s; }
.sound.on .bars i:nth-child(3) { animation-delay: -0.65s; }
@keyframes eq {
  0%, 100% { height: 3px; }
  50% { height: 12px; }
}

/* ---------------- Layout & Workspace ---------------- */
.app-container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 340px 1fr;
  padding: 88px clamp(18px, 4vw, 48px) 40px;
  gap: 40px;
  align-items: start;
}

/* ---------------- Left: Circular Dial & Controls ---------------- */
.dial-column {
  position: sticky;
  top: 96px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.intro-box {
  padding-left: 8px;
}
.intro-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 600 11px 'JetBrains Mono', monospace;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(var(--rgb), 0.1);
  border: 1px solid rgba(var(--rgb), 0.25);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 14px;
}
.intro-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.intro-title {
  font: 400 clamp(38px, 4.2vw, 56px)/0.95 'Instrument Serif', serif;
  letter-spacing: -0.02em;
}
.intro-title em {
  font-style: italic;
  color: var(--accent);
  transition: color 0.6s;
}
.intro-sub {
  color: var(--text-dim);
  font-size: 0.92rem;
  margin-top: 10px;
  font-weight: 300;
  line-height: 1.5;
}

/* Dial Wheel Area */
.dial-shell {
  position: relative;
  width: 320px;
  height: 380px;
  margin-top: 8px;
  user-select: none;
  -webkit-user-select: none;
}

.dial-center {
  position: absolute;
  left: 30px;
  top: 50%;
  width: 0;
  height: 0;
}

.ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  border: 1px solid var(--line);
}
.r1 {
  width: calc(var(--R) * 2);
  height: calc(var(--R) * 2);
  left: calc(var(--R) * -1);
  top: calc(var(--R) * -1);
}
.r2 {
  width: calc(var(--R) * 2 - 120px);
  height: calc(var(--R) * 2 - 120px);
  left: calc(var(--R) * -1 + 60px);
  top: calc(var(--R) * -1 + 60px);
  border-style: dashed;
  opacity: 0.4;
}

.ticks {
  position: absolute;
  width: calc(var(--R) * 2 + 48px);
  height: calc(var(--R) * 2 + 48px);
  left: calc(var(--R) * -1 - 24px);
  top: calc(var(--R) * -1 - 24px);
  border-radius: 50%;
  pointer-events: none;
  background: repeating-conic-gradient(rgba(255, 255, 255, 0.18) 0 0.3deg, transparent 0.3deg 4deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
  mask: radial-gradient(circle closest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
}

.wheel {
  position: absolute;
  left: 0;
  top: 0;
  transform: rotate(var(--rot));
  transition: transform 0.85s var(--ease);
}

.dy {
  position: absolute;
  left: 0;
  top: 0;
  transform: rotate(var(--a)) translateX(var(--R)) rotate(calc(-1 * var(--a) - var(--rot)));
  transition: transform 0.85s var(--ease), opacity 0.4s;
  cursor: pointer;
}

.dy .lb {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(16px, -50%);
  display: inline-flex;
  flex-direction: column;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(18, 24, 38, 0.7);
  border: 1px solid var(--line);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text-dim);
  white-space: nowrap;
  transition: background 0.3s, border-color 0.3s, color 0.3s, transform 0.3s var(--ease), box-shadow 0.3s;
}
.dy:hover .lb {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
  color: #fff;
  transform: translate(20px, -50%);
}
.dy.on .lb {
  background: var(--accent);
  color: #04060a !important;
  border-color: transparent;
  box-shadow: 0 0 24px rgba(var(--rgb), 0.5);
  font-weight: 700;
  transform: translate(24px, -50%) scale(1.05);
}

.dy .nm {
  font: 400 24px/1 'Instrument Serif', serif;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dy.on .nm {
  font-weight: 600;
}
.dy .ct {
  font: 600 10px 'JetBrains Mono', monospace;
  opacity: 0.8;
  margin-top: 2px;
}
.dy .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.dial-hint {
  font: 500 11px 'JetBrains Mono', monospace;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

/* ---------------- Right: Schedule Viewport Panel ---------------- */
.panel-column {
  min-width: 0;
}

.panel-card {
  background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: var(--specular), var(--shadow-lg);
  border-radius: 28px;
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  padding: 36px 40px 48px;
  position: relative;
  transition: border-color 0.4s, box-shadow 0.4s, transform 0.3s var(--ease), opacity 0.3s;
}
.panel-card.impact {
  animation: cardImpact 0.65s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardImpact {
  0% { box-shadow: inset 4px 0 0 var(--accent), 0 0 36px rgba(var(--rgb), 0.35); }
  100% { box-shadow: var(--specular), var(--shadow-lg); }
}

.p-header {
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.p-badge-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.p-day-title {
  font: 400 clamp(48px, 5.5vw, 76px)/0.92 'Instrument Serif', serif;
  letter-spacing: -0.02em;
}
.p-day-title span {
  color: var(--accent);
  transition: color 0.6s;
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 11.5px 'JetBrains Mono', monospace;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.chip.highlight {
  background: rgba(var(--rgb), 0.12);
  border-color: rgba(var(--rgb), 0.28);
  color: var(--accent);
  transition: color 0.6s, background 0.6s, border-color 0.6s;
}

.p-note {
  font-size: 0.96rem;
  color: var(--text-dim);
  font-weight: 300;
  max-width: 660px;
  margin-top: 14px;
  line-height: 1.6;
}

/* Section titles */
.sec-heading {
  display: flex;
  align-items: center;
  gap: 14px;
  font: 600 11px 'JetBrains Mono', monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}
.sec-heading::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.sec-heading.after-school {
  margin-top: 36px;
}

/* Lesson rows */
.rows-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row-item {
  display: grid;
  grid-template-columns: 82px 36px 1fr;
  gap: 16px;
  align-items: center;
  padding: 14px 18px;
  border-radius: 18px;
  background: var(--glass-card);
  border: 1px solid var(--line);
  transition: background 0.25s, border-color 0.25s, transform 0.25s var(--ease), box-shadow 0.25s;
  cursor: pointer;
}
.row-item:hover {
  background: var(--glass-hover);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateX(2px);
}
.row-item.lit {
  background: rgba(var(--rgb), 0.16) !important;
  border-color: rgba(var(--rgb), 0.45) !important;
  box-shadow: inset 3.5px 0 0 var(--accent), 0 4px 24px rgba(var(--rgb), 0.22) !important;
  transform: translateX(4px);
}
.row-item.live {
  border-color: rgba(var(--rgb), 0.5);
  background: linear-gradient(90deg, rgba(var(--rgb), 0.18), var(--glass-card));
  box-shadow: inset 3px 0 0 var(--accent);
}

.t-col {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.25;
}
.t-start {
  font-size: 13.5px;
  font-weight: 700;
  color: #fff;
}
.t-end {
  font-size: 11px;
  color: var(--muted);
}

.idx-badge {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font: 700 11px 'JetBrains Mono', monospace;
  color: var(--accent);
  background: rgba(var(--rgb), 0.12);
  border: 1px solid rgba(var(--rgb), 0.3);
  transition: color 0.6s, background 0.6s, border-color 0.6s;
}
.idx-badge svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.row-item.live .idx-badge {
  background: var(--accent);
  color: #04060a;
  border-color: transparent;
  box-shadow: 0 0 14px var(--accent);
}

.main-col {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.subject-wrap {
  flex: 1;
}
.subject-title {
  font: 600 1.02rem 'Plus Jakarta Sans', sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.sub-tag {
  font: 600 10px 'JetBrains Mono', monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(var(--rgb), 0.12);
  border: 1px solid rgba(var(--rgb), 0.28);
  padding: 2px 7px;
  border-radius: 6px;
}
.live-beacon {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 700 9px 'JetBrains Mono', monospace;
  letter-spacing: 0.1em;
  background: var(--accent);
  color: #04060a;
  padding: 2px 6px;
  border-radius: 6px;
}
.live-beacon .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #04060a;
  animation: pulseBeacon 1.2s infinite;
}
@keyframes pulseBeacon {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.subject-desc {
  font-size: 0.86rem;
  color: var(--text-dim);
  font-weight: 300;
  margin-top: 3px;
}

.room-badge {
  font: 600 11.5px 'JetBrains Mono', monospace;
  letter-spacing: 0.02em;
  color: var(--accent);
  background: rgba(var(--rgb), 0.1);
  border: 1px solid rgba(var(--rgb), 0.25);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
  transition: color 0.6s, background 0.6s, border-color 0.6s;
}

/* Break interval divider */
.break-chip {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 18px 4px 114px;
}
.break-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 500 10.5px 'JetBrains Mono', monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.025);
  border: 1px dashed rgba(255, 255, 255, 0.1);
  padding: 4px 12px;
  border-radius: 8px;
}
.break-pill svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* Mobile segmented control (hidden on desktop) */
.mobile-day-bar {
  display: none;
}

/* ---------------- Responsive Styles ---------------- */
@media (max-width: 960px) {
  .app-container {
    grid-template-columns: 280px 1fr;
    gap: 28px;
    padding-top: 80px;
  }
}

@media (max-width: 768px) {
  body {
    overflow-y: auto !important;
  }
  .app-container {
    display: flex;
    flex-direction: column;
    padding: 72px 14px 40px;
    gap: 20px;
  }

  .dial-column {
    position: static;
    width: 100%;
    gap: 16px;
  }
  .dial-shell {
    display: none; /* Hide complex desktop circular dial on mobile */
  }

  /* Show elegant mobile segmented bar */
  .mobile-day-bar {
    display: flex;
    position: sticky;
    top: 61px;
    z-index: 25;
    background: rgba(7, 9, 14, 0.94);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 8px 0;
    margin: 0 -4px;
    width: 100%;
  }
  .mobile-nav {
    position: relative;
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    padding: 4px;
    border-radius: 999px;
    width: 100%;
  }
  .mobile-pill-active {
    position: absolute;
    top: 4px;
    left: 0;
    width: var(--m-w, 64px);
    height: calc(100% - 8px);
    border-radius: 999px;
    background: var(--accent);
    transform: translateX(var(--m-x, 0px));
    transition: transform 0.4s var(--ease), background 0.6s;
    pointer-events: none;
  }
  .m-btn {
    flex: 1;
    height: 42px;
    border-radius: 999px;
    font: 600 0.92rem 'Plus Jakarta Sans', sans-serif;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .m-btn.on {
    color: #04060a;
    font-weight: 700;
  }

  .panel-card {
    padding: 24px 16px 32px;
    border-radius: 22px;
  }
  .p-day-title {
    font-size: 2.4rem;
  }

  .row-item {
    grid-template-columns: 62px 1fr;
    gap: 8px 12px;
    padding: 14px 12px;
    border-radius: 16px;
  }
  .idx-badge {
    display: none;
  }
  .t-col {
    align-items: flex-start;
  }
  .t-start {
    font-size: 12.5px;
  }
  .t-end {
    font-size: 10.5px;
  }
  .main-col {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;

  function makeDirs(){
    for(let i = 0; i < N; i++){
      const k = i * 3; sph(1, DIR, k); const d = 2.5 + Math.pow(Math.random(), 1.5) * 7;
      DIR[k] *= d; DIR[k + 1] *= d; DIR[k + 2] *= d;
      if(Math.random() < 0.25) DIR[k + 2] += 3 + Math.random() * 6;
    }
  }
  buildShape(startDay, TO); for(let i = 0; i < N; i++) sph(rnd(5, 11), FROM, i * 3); makeDirs();

  const geo = new THREE.BufferGeometry();
  const aFrom = new THREE.BufferAttribute(FROM, 3), aTo = new THREE.BufferAttribute(TO, 3), aDir = new THREE.BufferAttribute(DIR, 3);
  geo.setAttribute("position", aFrom); geo.setAttribute("aTo", aTo); geo.setAttribute("aDir", aDir);
  geo.setAttribute("aRand", new THREE.BufferAttribute(RA, 1)); geo.setAttribute("aSize", new THREE.BufferAttribute(SZ, 1));

  const cA = new THREE.Color(DAYS[startDay].c1), cB = new THREE.Color(DAYS[startDay].c2), tA = cA.clone(), tB = cB.clone();
  const U = { uT: { value: E }, uTime: { value: 0 }, uSpin: { value: 0 }, uSize: { value: 26 }, uPR: { value: PR }, uFlash: { value: 0 }, uColor: { value: cA }, uColor2: { value: cB } };
  const mat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec3 aTo; attribute vec3 aDir; attribute float aRand; attribute float aSize;
      uniform float uT, uTime, uSpin, uSize, uPR, uFlash;
      varying float vRand;
      const float E = ${E.toFixed(2)}; const float C = ${C.toFixed(2)};
      vec3 rotY(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z); }
      float ease(float x){ return x < .5 ? 4. * x * x * x : 1. - pow(-2. * x + 2., 3.) / 2.; }
      void main(){
        vec3 fromP = rotY(position, uSpin);
        vec3 toP = rotY(aTo, uSpin);
        float tE = min(uT, E);
        vec3 burst = aDir * (1. - exp(-3. * tE));
        vec3 turb = vec3(sin(aRand * 40. + uT * 2.1), sin(aRand * 57. + uT * 1.7), cos(aRand * 33. + uT * 2.4)) * .6 * smoothstep(0., .5, tE);
        float p = clamp((uT - E - aRand * .35) / C, 0., 1.);
        float e = ease(p);
        vec3 pos = mix(fromP + burst + turb, toP, e);
        pos = rotY(pos, sin(e * 3.14159) * 1.6 * step(E, uT));
        pos *= 1. + sin(uTime * 1.4 + aRand * 12.) * .012 * e;
        vec4 mv = modelViewMatrix * vec4(pos, 1.);
        gl_Position = projectionMatrix * mv;
        float tw = .75 + .25 * sin(uTime * 2. + aRand * 50.);
        gl_PointSize = min(uSize * aSize * uPR * tw * (1. + uFlash * .6) / max(-mv.z, .1), 48.);
        vRand = aRand;
      }`,
    fragmentShader: `
      uniform vec3 uColor, uColor2; uniform float uFlash; varying float vRand;
      void main(){
        float d = length(gl_PointCoord - .5); if(d > .5) discard;
        float a = pow(1. - d * 2., 1.8);
        vec3 c = mix(uColor, uColor2, smoothstep(.65, .95, vRand));
        c = mix(c, vec3(1.), pow(a, 3.) * .5 + uFlash * .3);
        gl_FragColor = vec4(c * a * .8, a);
      }`
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; group.add(pts);

  const gc = document.createElement("canvas"); gc.width = gc.height = 128;
  const gx = gc.getContext("2d"), gr = gx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.2, "rgba(255,255,255,.3)"); gr.addColorStop(0.55, "rgba(255,255,255,.05)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  gx.fillStyle = gr; gx.fillRect(0, 0, 128, 128);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.setScalar(6.5); group.add(glow);

  const shock = new THREE.Mesh(new THREE.RingGeometry(0.94, 1, 96), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
  scene.add(shock);

  const SN = 1200, sp = new Float32Array(SN * 3); for(let i = 0; i < SN; i++) sph(rnd(25, 70), sp, i * 3);
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xa5b4fc, size: 0.08, transparent: true, opacity: 0.6, depthWrite: false }));
  scene.add(stars);

  const base = { x: 0, y: 0, z: 7.5 };
  function layout(){
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if(w > 960){ base.x = w > 1400 ? 1.8 : 1.4; base.y = 0; base.z = 7.5; } else { base.x = 0; base.y = 1.2; base.z = w < 600 ? 10.5 : 9; }
  }
  layout(); addEventListener("resize", layout);
  let mx = 0, my = 0, sx = 0, sy = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth * 2 - 1; my = -(e.clientY / innerHeight * 2 - 1); }, { passive: true });

  let uT = E, spin = 0, flash = 0, ringT = 9, glowOp = 0, queued = null, pendingColor = null;
  function burst(d){
    FROM.set(TO); buildShape(d, TO); makeDirs();
    aFrom.needsUpdate = aTo.needsUpdate = aDir.needsUpdate = true;
    uT = 0; flash = 1; ringT = 0; pendingColor = d;
    shock.material.color.copy(cA);
    hooks.burst();
  }
  function request(d){ if(uT < TOTAL){ queued = d; return; } burst(d); }

  let last = performance.now(), time = 0;
  function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(0.033, (now - last) / 1000); last = now; time += dt; uT += dt;
    if(pendingColor !== null && uT > E){ tA.set(DAYS[pendingColor].c1); tB.set(DAYS[pendingColor].c2); pendingColor = null; hooks.collapse(); }
    if(queued !== null && uT >= TOTAL){ const q = queued; queued = null; burst(q); }
    const k = 1 - Math.exp(-4 * dt); sx += (mx - sx) * k; sy += (my - sy) * k;
    const ck = 1 - Math.exp(-2.4 * dt); cA.lerp(tA, ck); cB.lerp(tB, ck);
    flash *= Math.exp(-3 * dt);
    spin += dt * (uT < E ? 0.7 : 0.13);
    U.uT.value = uT; U.uTime.value = time; U.uSpin.value = spin; U.uFlash.value = flash;
    group.rotation.x = sy * 0.3; group.rotation.y = sx * 0.45;
    group.position.set(base.x + sx * 0.25, base.y + sy * 0.15, 0);
    camera.position.set(sx * 0.35, sy * 0.2, base.z); camera.lookAt(base.x * 0.15, base.y * 0.5, 0);
    glowOp += ((uT < E + 0.4 ? 0.04 : 0.42) - glowOp) * (1 - Math.exp(-3 * dt));
    glow.material.opacity = glowOp; glow.material.color.copy(cA);
    if(ringT < 1.2){ ringT += dt; const p = ringT / 1.2, s = 1 + (1 - Math.pow(1 - p, 3)) * 9; shock.scale.set(s, s, s); shock.material.opacity = (1 - p) * 0.6; shock.position.copy(group.position); }
    else shock.material.opacity = 0;
    stars.rotation.y += dt * 0.006;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
  return { request };
}

/* ---------------- FLUID GOOEY ENGINE ---------------- */
const Fluid = {
  anim: null,
  launch(fromEl, toEl, color, onHit){
    if(!fromEl || !toEl) return;
    const donor = $("#donorBlob"), travel = $("#travelBlob"), target = $("#targetBlob"), splash = $("#splashGroup");
    if(!donor || !travel || !target) return;

    donor.setAttribute("fill", color);
    travel.setAttribute("fill", color);
    target.setAttribute("fill", color);

    const r1 = fromEl.getBoundingClientRect();
    const r2 = toEl.getBoundingClientRect();
    const isMobile = window.innerWidth <= 768;

    let sx, sy, ex, ey;
    if(isMobile){
      sx = r1.left + r1.width / 2;
      sy = r1.bottom;
      ex = sx;
      ey = r2.top + 10;
    } else {
      sx = r1.right;
      sy = r1.top + r1.height / 2;
      ex = r2.left;
      ey = sy;
    }

    if(this.anim) cancelAnimationFrame(this.anim);
    const duration = 340, start = performance.now();

    const frame = now => {
      const p = Math.min(1, (now - start) / duration);
      if(p < 0.25){
        const p1 = p / 0.25;
        donor.setAttribute("cx", sx); donor.setAttribute("cy", sy);
        donor.setAttribute("r", 15 * (1 - p1 * 0.3));
        travel.setAttribute("cx", sx + (ex - sx) * 0.15 * p1);
        travel.setAttribute("cy", sy + (ey - sy) * 0.15 * p1);
        travel.setAttribute("r", 9 * p1);
        target.setAttribute("r", 0);
      } else if(p < 0.85){
        const p2 = (p - 0.25) / 0.6;
        const ease = p2 < 0.5 ? 4 * p2 * p2 * p2 : 1 - Math.pow(-2 * p2 + 2, 3) / 2;
        donor.setAttribute("r", Math.max(0, 10 * (1 - p2 * 1.5)));
        travel.setAttribute("cx", sx + (ex - sx) * ease);
        travel.setAttribute("cy", sy + (ey - sy) * ease);
        travel.setAttribute("r", 11);
        target.setAttribute("r", 0);
      } else {
        const p3 = (p - 0.85) / 0.15;
        donor.setAttribute("r", 0);
        travel.setAttribute("r", 11 * (1 - p3));
        target.setAttribute("cx", ex); target.setAttribute("cy", ey);
        target.setAttribute("r", 16 * Math.sin(p3 * Math.PI));
      }

      if(p < 1){
        this.anim = requestAnimationFrame(frame);
      } else {
        donor.setAttribute("r", 0); travel.setAttribute("r", 0); target.setAttribute("r", 0);
        Sound.splash();
        this.makeSplash(ex, ey, color, splash);
        if(onHit) onHit(ex, ey);
      }
    };
    this.anim = requestAnimationFrame(frame);
  },
  makeSplash(x, y, color, group){
    group.innerHTML = "";
    for(let i = 0; i < 5; i++){
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y);
      c.setAttribute("r", rnd(2.5, 4.5));
      c.setAttribute("fill", color);
      group.appendChild(c);
      const angle = rnd(-Math.PI * 0.5, Math.PI * 0.5), dist = rnd(16, 36);
      c.animate([
        { transform: "translate(0, 0) scale(1)", opacity: 1 },
        { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }
      ], { duration: 320, easing: "ease-out", fill: "forwards" });
    }
    setTimeout(() => { group.innerHTML = ""; }, 350);
  }
};

/* ---------------- UI CONTROLLER & RENDERER ---------------- */
const root = document.documentElement;
const STEP = 22;
const now = new Date(), wd = now.getDay(), todayIdx = (wd >= 1 && wd <= 5) ? wd - 1 : -1;
let current = -1, GL = null;

const wheel = $("#wheel"), mobileNav = $("#mobileNav"), mPill = $("#mPill");
const panelCard = $("#panelCard"), panelHead = $("#panelHead"), panelBody = $("#panelBody"), flashEl = $("#flash");

/* Build Desktop Dial items */
const dialButtons = DAYS.map((D, i) => {
  const b = document.createElement("button");
  b.className = "dy";
  b.style.setProperty("--a", (i * STEP) + "deg");
  b.setAttribute("aria-label", D.name);
  b.innerHTML = `
    <span class="lb">
      <span class="nm">${D.name}</span>
      <span class="ct">${D.lessons.length} lessons${i === todayIdx ? ' · Today' : ''}</span>
    </span>
  `;
  b.addEventListener("click", () => selectDay(i));
  wheel.appendChild(b);
  return b;
});

/* Build Mobile segmented buttons */
const mobileButtons = DAYS.map((D, i) => {
  const b = document.createElement("button");
  b.className = "m-btn";
  b.textContent = D.short;
  b.setAttribute("role", "tab");
  b.addEventListener("click", () => selectDay(i));
  mobileNav.appendChild(b);
  return b;
});

function syncMobilePill(){
  const b = mobileButtons[current]; if(!b) return;
  mobileNav.style.setProperty("--m-x", b.offsetLeft + "px");
  mobileNav.style.setProperty("--m-w", b.offsetWidth + "px");
}
addEventListener("resize", syncMobilePill);

function setDialRotation(idx){
  root.style.setProperty("--rot", (-idx * STEP) + "deg");
  dialButtons.forEach((btn, i) => {
    btn.classList.toggle("on", i === idx);
    btn.style.opacity = Math.max(0.3, 1 - Math.abs(i - idx) * 0.22);
  });
  mobileButtons.forEach((btn, i) => {
    btn.classList.toggle("on", i === idx);
  });
  syncMobilePill();
}

function setAccent(idx){
  const c = DAYS[idx].c1;
  root.style.setProperty("--accent", c);
  root.style.setProperty("--rgb", rgb(c));
}

function triggerRadialRipple(hitX, hitY){
  panelCard.classList.remove("impact");
  void panelCard.offsetWidth;
  panelCard.classList.add("impact");

  const rows = $$(".row-item");
  rows.forEach(r => {
    const rect = r.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(hitX - cx, hitY - cy);
    const delay = Math.min(220, Math.round(dist * 0.28));
    setTimeout(() => {
      r.classList.add("lit");
      setTimeout(() => r.classList.remove("lit"), 460);
    }, delay);
  });
}

function render(d){
  const D = DAYS[d];
  const m = now.getHours() * 60 + now.getMinutes();
  const times = D.times;
  const uniqueRooms = new Set(D.lessons.map(l => l.room)).size;
  const startTm = times[0][0];
  const endTm = times[D.lessons.length - 1][1];

  panelHead.innerHTML = `
    <div class="p-badge-row">
      <span class="mono">0${d + 1} / 05 · ${D.place}${d === todayIdx ? ' · Today' : ''}</span>
      <span class="mono">${D.lessons.length} Periods</span>
    </div>
    <h2 class="p-day-title">${D.name}<span>.</span></h2>
    <div class="meta-row">
      <span class="chip highlight">${D.lessons.length} Lessons</span>
      <span class="chip">${uniqueRooms} ${uniqueRooms === 1 ? 'Room' : 'Rooms'}</span>
      <span class="chip">${startTm} – ${endTm}</span>
      ${D.gym ? '<span class="chip highlight">Gym Day</span>' : ''}
    </div>
    <p class="p-note">${D.note}</p>
  `;

  let lessonsHtml = '';
  D.lessons.forEach((L, k) => {
    const t = times[k];
    const live = (d === todayIdx) && (m >= toMin(t[0])) && (m < toMin(t[1]));

    lessonsHtml += `
      <div class="row-item${live ? ' live' : ''}">
        <div class="t-col">
          <span class="t-start">${t[0]}</span>
          <span class="t-end">${t[1]}</span>
        </div>
        <div class="idx-badge">${k + 1}</div>
        <div class="main-col">
          <div class="subject-wrap">
            <h4 class="subject-title">
              <span>${L.s}</span>
              ${L.sub ? `<span class="sub-tag">${L.sub}</span>` : ''}
              ${live ? `<span class="live-beacon"><span class="dot"></span>LIVE</span>` : ''}
            </h4>
            <p class="subject-desc">${L.n}</p>
          </div>
          <span class="room-badge">${L.room}</span>
        </div>
      </div>
    `;

    if(k < D.lessons.length - 1 && D.breaks[k]){
      lessonsHtml += `
        <div class="break-chip">
          <span class="break-pill">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span>${D.breaks[k]}</span>
          </span>
        </div>
      `;
    }
  });

  let afterHtml = '';
  AFTER[d].forEach(A => {
    afterHtml += `
      <div class="row-item">
        <div class="t-col">
          <span class="t-start">${A.t.split('–')[0]}</span>
          <span class="t-end">${A.t.includes('–') ? A.t.split('–')[1] : 'Routine'}</span>
        </div>
        <div class="idx-badge"><svg viewBox="0 0 24 24">${ICONS[A.k]}</svg></div>
        <div class="main-col">
          <div class="subject-wrap">
            <h4 class="subject-title">
              <span>${A.a}</span>
              <span class="sub-tag">${TAGS[A.k]}</span>
            </h4>
            <p class="subject-desc">${A.n}</p>
          </div>
          <span class="room-badge">${TAGS[A.k]}</span>
        </div>
      </div>
    `;
  });

  panelBody.innerHTML = `
    <div class="sec-heading">Lessons Schedule</div>
    <div class="rows-list">${lessonsHtml}</div>
    <div class="sec-heading after-school">After School Routine</div>
    <div class="rows-list">${afterHtml}</div>
  `;
}

const hooks = {
  burst(){
    Sound.boom(); Sound.shatter();
    const mob = innerWidth <= 960;
    flashEl.style.setProperty("--fx", mob ? "50%" : "72%");
    flashEl.style.setProperty("--fy", mob ? "26%" : "50%");
    flashEl.classList.remove("go"); void flashEl.offsetWidth; flashEl.classList.add("go");
  },
  collapse(){ Sound.implode(); setTimeout(() => Sound.chime(), 600); }
};

function shatter(d){
  if(GL) GL.request(d);
  else { hooks.burst(); setTimeout(hooks.collapse, 900); }
}

function selectDay(d){
  if(d === current) return;
  const isFirst = current === -1;
  current = d;

  setDialRotation(d);
  setAccent(d);
  render(d);

  if(!isFirst){
    Sound.haptic();
    const isMobile = window.innerWidth <= 768;
    const origin = isMobile ? mobileButtons[d] : dialButtons[d];
    Fluid.launch(origin, panelCard, DAYS[d].c1, (hitX, hitY) => {
      triggerRadialRipple(hitX, hitY);
    });
    shatter(d);
  }
}

$("#shatterBtn").addEventListener("click", () => shatter(current));

/* Wheel scroll on Dial */
let lastWheel = 0;
const dialShell = $("#dialShell");
if(dialShell){
  dialShell.addEventListener("wheel", e => {
    e.preventDefault();
    const t = performance.now();
    if(t - lastWheel < 450) return;
    lastWheel = t;
    const dir = (e.deltaY || e.deltaX) > 0 ? 1 : -1;
    selectDay(Math.max(0, Math.min(DAYS.length - 1, current + dir)));
  }, { passive: false });
}

/* Keyboard arrows */
addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "ArrowRight"){ e.preventDefault(); selectDay((current + 1) % 5); }
  if(e.key === "ArrowUp" || e.key === "ArrowLeft"){ e.preventDefault(); selectDay((current + 4) % 5); }
});

/* Touch Swipe Navigation on Mobile */
let tStartX = 0, tStartY = 0;
addEventListener("touchstart", e => {
  tStartX = e.touches[0].clientX;
  tStartY = e.touches[0].clientY;
}, { passive: true });

addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tStartX;
  const dy = e.changedTouches[0].clientY - tStartY;
  if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if(dx < 0) selectDay((current + 1) % 5);
    else selectDay((current + 4) % 5);
  }
}, { passive: true });

/* Auto Boot */
const startDay = todayIdx >= 0 ? todayIdx : 0;
try {
  if(window.THREE && document.createElement("canvas").getContext("webgl")) GL = initGL(startDay, hooks);
} catch(err){ console.warn("WebGL unavailable", err); GL = null; }

selectDay(startDay);
if(document.fonts) document.fonts.ready.then(syncMobilePill);

})();
</script>
